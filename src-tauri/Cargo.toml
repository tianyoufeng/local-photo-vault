[package]
name = "local-photo-vault"
version = "1.0.0"
description = "LocalPhotoVault - 本地照片管理应用"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }
schemars = { version = "0.8.21", features = ["preserve_order", "indexmap2"] }
indexmap1 = { version = "1.9.3", features = ["std"], package = "indexmap" }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
